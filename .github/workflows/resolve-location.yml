name: Resolve storefront Street View

on:
  push:
    branches: ["redesign/hookah-map"]
    paths:
      - ".github/workflows/resolve-location.yml"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build recent panorama heading comparison
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pano = 'DQsmIN4XXa6V3eOitOKiDQ'
          lat = '40.821979851'
          lng = '-74.219975507'
          headings = (100, 120, 130, 140, 160, 180)
          cards = []
          for heading in headings:
              src = (
                  'https://www.google.com/maps/embed?pb='
                  f'!4v1788260000000!6m8!1m7!1s{pano}!2m2!1d{lat}!2d{lng}'
                  f'!3f{heading}!4f0!5f0.7820865974627469'
              )
              cards.append(
                  f'<section><h2>{heading}°</h2><iframe src="{src}" loading="eager" '
                  'allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe></section>'
              )
          html = f'''<!doctype html><html><head><meta charset="utf-8"><style>
          html,body{{margin:0;background:#050609;color:white;font-family:system-ui}}
          main{{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}}
          section{{border:1px solid #334;background:#090d12;padding:8px}}
          h2{{font-size:14px;margin:0 0 6px}}
          iframe{{width:100%;height:500px;border:0}}
          </style></head><body><main>{''.join(cards)}</main></body></html>'''
          Path('streetview-grid.html').write_text(html)
          PY

      - name: Capture heading comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --window-size=1600,1800 --virtual-time-budget=18000 \
            --screenshot=streetview-headings.png http://127.0.0.1:8000/streetview-grid.html

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: streetview-heading-grid
          path: streetview-headings.png
          if-no-files-found: error
          retention-days: 2
