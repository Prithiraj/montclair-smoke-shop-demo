name: Capture redesign visual QA

on:
  push:
    branches: ["redesign/hookah-map"]
    paths:
      - ".github/workflows/visual-qa.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install project
        run: npm ci --no-audit --no-fund

      - name: Validate and build
        run: |
          npm run validate
          npm test
          npm run build

      - name: Install browser driver
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium

      - name: Capture desktop and mobile views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-qa
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          cat >capture.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const output = 'visual-qa';
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--use-gl=swiftshader',
              '--enable-unsafe-swiftshader',
              '--ignore-gpu-blocklist',
            ],
          });

          const allErrors = [];
          const prepare = async (page, label) => {
            page.on('console', (message) => {
              if (message.type() === 'error' || message.type() === 'warning') {
                allErrors.push(`${label} console ${message.type()}: ${message.text()}`);
              }
            });
            page.on('pageerror', (error) => allErrors.push(`${label} pageerror: ${error.message}`));
            await page.addInitScript(() => {
              sessionStorage.setItem('montclair-signal-age-ack', 'true');
              localStorage.setItem('montclair-signal-reduce-motion', 'false');
              localStorage.setItem('montclair-signal-theme', 'obsidian');
            });
          };

          const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const page = await desktop.newPage();
          await prepare(page, 'desktop');
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.locator('.hero--hookah').waitFor();
          await page.waitForTimeout(4500);
          await page.screenshot({ path: `${output}/01-home-desktop.png` });

          const report = await page.evaluate(() => ({
            title: document.title,
            heading: document.querySelector('h1')?.textContent?.replace(/\s+/g, ' ').trim(),
            canvasCount: document.querySelectorAll('canvas').length,
            webgl: Boolean(document.querySelector('canvas')?.getContext('webgl2') || document.querySelector('canvas')?.getContext('webgl')),
            scrollHeight: document.documentElement.scrollHeight,
          }));

          for (const [index, label] of ['Chrome', 'Onyx', 'Iridescent'].entries()) {
            const button = page.getByRole('button', { name: label, exact: true });
            if (await button.count()) {
              await button.click();
              await page.waitForTimeout(1000);
              await page.screenshot({ path: `${output}/0${index + 2}-home-${label.toLowerCase()}.png` });
            }
          }

          await page.locator('#visit').scrollIntoViewIfNeeded();
          await page.waitForTimeout(2200);
          await page.screenshot({ path: `${output}/05-visit-map-viewport.png` });
          await page.locator('#visit').screenshot({ path: `${output}/06-visit-map-section.png` });

          const storefrontButton = page.getByRole('button', { name: 'Storefront', exact: true });
          if (await storefrontButton.count()) {
            await storefrontButton.click();
            await page.waitForTimeout(8000);
            await page.screenshot({ path: `${output}/07-visit-storefront-viewport.png` });
            await page.locator('#visit').screenshot({ path: `${output}/08-visit-storefront-section.png` });
          }
          await desktop.close();

          const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          const mobilePage = await mobile.newPage();
          await prepare(mobilePage, 'mobile');
          await mobilePage.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await mobilePage.locator('.hero--hookah').waitFor();
          await mobilePage.waitForTimeout(4500);
          await mobilePage.screenshot({ path: `${output}/09-home-mobile.png` });
          await mobilePage.locator('#visit').scrollIntoViewIfNeeded();
          await mobilePage.waitForTimeout(2200);
          await mobilePage.screenshot({ path: `${output}/10-visit-mobile.png` });
          await mobile.close();

          fs.writeFileSync(`${output}/browser-report.json`, JSON.stringify(report, null, 2));
          fs.writeFileSync(`${output}/browser-errors.txt`, `${allErrors.join('\n')}\n`);
          await browser.close();
          NODE

          node capture.mjs
          rm -f capture.mjs

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: montclair-redesign-visual-qa
          path: visual-qa
          if-no-files-found: error
          retention-days: 3
