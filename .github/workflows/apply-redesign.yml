name: Apply hookah and real-location redesign

on:
  push:
    branches: ["redesign/hookah-map"]
    paths:
      - ".redesign/**"
      - ".github/workflows/apply-redesign.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign/hookah-map
          fetch-depth: 0

      - name: Materialize verified redesign
        shell: bash
        run: |
          set -euo pipefail
          cat .redesign/part-* > /tmp/redesign.tar.gz.b64
          base64 --decode /tmp/redesign.tar.gz.b64 > /tmp/redesign.tar.gz
          echo "a0d66ed8c45d263f8241a3721ce4f1ca77b89f4fa54aef4732cf6775ccec41ed  /tmp/redesign.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf /tmp/redesign.tar.gz
          rm -rf .redesign
          rm -f .github/workflows/resolve-location.yml
          rm -f .github/workflows/apply-redesign.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate public content
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: montclair-hookah-map-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: replace Signal Core with hookah and real location"
          git push origin HEAD:redesign/hookah-map
