name: Inspect public storefront reference photos

on:
  push:
    branches: ["redesign/hookah-map"]
    paths:
      - ".github/workflows/photo-research.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download public listing references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storefront-references
          urls=(
            'https://cdn10.localdatacdn.com/nj/montclair/8793041/original/NgqgY9wI9X.jpg'
            'https://cdn10.localdatacdn.com/nj/montclair/8793041/original/vvxSWgEsut.jpg'
            'https://cdn8.localdatacdn.com/nj/montclair/8793041/original/QZIJa9DJ57.jpg'
            'https://cdn8.localdatacdn.com/nj/montclair/8793041/original/n56HjQwQIK.jpg'
            'https://cdn8.localdatacdn.com/nj/montclair/8793041/original/zZtHKr124e.jpg'
            'https://cdn8.localdatacdn.com/nj/montclair/8793041/original/t1GqgV2rou.jpg'
            'https://cdn8.localdatacdn.com/nj/montclair/8793041/original/T87uVkyeFh.jpg'
            'https://cdn8.localdatacdn.com/nj/montclair/8793041/original/Vig4kwVVqn.jpg'
            'https://cdn8.localdatacdn.com/nj/montclair/8793041/original/RuK7uePtJu.jpg'
          )
          for url in "${urls[@]}"; do
            file="storefront-references/$(basename "$url")"
            curl --fail --location --retry 2 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              -e 'https://www.loc8nearme.com/' \
              "$url" -o "$file" || rm -f "$file"
          done
          find storefront-references -type f -maxdepth 1 -print
          test "$(find storefront-references -type f | wc -l)" -gt 0

      - name: Upload references
        uses: actions/upload-artifact@v4
        with:
          name: storefront-public-reference-photos
          path: storefront-references
          if-no-files-found: error
          retention-days: 1
