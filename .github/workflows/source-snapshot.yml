name: Snapshot redesign source

on:
  push:
    branches: ["redesign/hookah-map"]
    paths:
      - ".github/workflows/source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: montclair-redesign-source
          path: |
            src
            public
            scripts
            docs
            package.json
            package-lock.json
            vite.config.js
            netlify.toml
            index.html
            README.md
          if-no-files-found: error
          retention-days: 1
