name: Identify storefront Street View heading

on:
  push:
    branches: ["redesign/hookah-map"]
    paths:
      - ".github/workflows/streetview-research.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install panorama tooling
        run: |
          python3 -m pip install --disable-pip-version-check --quiet streetlevel py360convert pillow numpy

      - name: Download panorama and create storefront crops
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          import numpy as np
          import py360convert
          from PIL import Image, ImageDraw, ImageEnhance
          from streetlevel import streetview

          PANO_ID = 'DQsmIN4XXa6V3eOitOKiDQ'
          pano = streetview.find_panorama_by_id(PANO_ID)
          if pano is None:
              raise SystemExit('Panorama not found')

          print('PANO_METADATA', pano)
          image = streetview.get_panorama(pano, zoom=4).convert('RGB')
          Path('streetview-metadata.txt').write_text(repr(pano) + '\n')
          source = np.asarray(image)

          output = Path('storefront-crops')
          output.mkdir(exist_ok=True)
          headings = (122, 128, 134, 140, 146, 152, 158, 164, 170, 176)
          cards = []

          for heading in headings:
              perspective = py360convert.e2p(
                  source,
                  fov_deg=(34, 25),
                  u_deg=heading,
                  v_deg=-1.5,
                  out_hw=(1050, 1400),
              )
              crop = Image.fromarray(perspective.astype(np.uint8))
              crop = ImageEnhance.Contrast(crop).enhance(1.08)
              crop = ImageEnhance.Sharpness(crop).enhance(1.35)
              crop.save(output / f'heading-{heading}.jpg', quality=94)

              thumb = crop.resize((700, 525), Image.Resampling.LANCZOS)
              card = Image.new('RGB', (700, 566), '#050609')
              card.paste(thumb, (0, 41))
              draw = ImageDraw.Draw(card)
              draw.text((16, 13), f'heading {heading} degrees', fill='white')
              cards.append(card)

          cols = 2
          rows = (len(cards) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * 700, rows * 566), '#050609')
          for index, card in enumerate(cards):
              sheet.paste(card, ((index % cols) * 700, (index // cols) * 566))
          sheet.save('storefront-crops/contact-sheet.jpg', quality=92)
          PY

      - name: Upload Street View research
        uses: actions/upload-artifact@v4
        with:
          name: streetview-storefront-crops
          path: |
            storefront-crops
            streetview-metadata.txt
          if-no-files-found: error
          retention-days: 1
